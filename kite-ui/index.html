<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            padding-top: 10px;
            background-color: #f5f5f5;
        }

        .row {
            display: flex;
            flex-flow: row;
        }

        .column {
            display: flex;
            flex-flow: column;
        }

        .wrap {
            flex-wrap: wrap;
        }

        .card {
            background-color: #FFF;
            box-shadow: 0 4px 8px 0 silver;
        }

        .tasks-container {
            flex: 1;
            height: 90vh;
            gap: 8px;
            padding-top: 8px;
            align-items: center;
        }


        .wh-100px {
            width: 100px;
            height: 100px;
        }


        .gap-16 {
            gap: 16px;
        }
    </style>


</head>



<body>

    <h1>Tasks Page</h1>
    <br>
    <br>


    <h1 id="textResult"></h1>
    <br />
    <br />

    <div class="row wrap gap-16">


        <input id="inputTaskId" type="number" placeholder="Task Id" />
        <br />
        <input id="inputTaskName" type="text" placeholder="Task Name" />
        <br />
        <label for="inputTaskDone"> is done </label>
        <input id="inputTaskDone" type="checkbox" />
        <br />
        <input id="inputTaskDesc" type="text" placeholder="Task Desc" />
        <br />
        <select id="inputTaskCatId">
            <option value="1">Log</option>
            <option value="2">Todo</option>
            <option value="3">In Progress</option>
            <option value="4">Review</option>
            <option value="5">Done</option>
            <option value="6">Quick Tasks</option>
        </select>


    </div>

    <br>

    <div class="row wrap gap-16">

        <button id="btnPing">ping</button>
        <button id="btnCreate">Create</button>
        <button id="btnIndex">index</button>
        <button id="btnUpdate">update</button>


    </div>

    <br>

    <div class="row wrap gap-16">

        <div id="logContainer" class="card column tasks-container gap-16">
        </div>

        <div id="todoContainer" class="card column tasks-container gap-16">
        </div>

        <div id="inProgressContainer" class="card column tasks-container gap-16">
        </div>

        <div id="reviewContainer" class="card column tasks-container gap-16">
        </div>

        <div id="doneContainer" class="card column tasks-container gap-16">
        </div>

    </div>


    <template id="templateTaskCard">
        <div class="card wh-100px">
            <h3 id="taskName"></h3>
        </div>
    </template>


    <script>

        let inputTaskName = document.getElementById("inputTaskName")
        let logContainer = document.getElementById("logContainer")
        let todoContainer = document.getElementById("todoContainer")
        let inProgressContainer = document.getElementById("inProgressContainer")
        let reviewContainer = document.getElementById("reviewContainer")
        let doneContainer = document.getElementById("doneContainer")
        let templateTaskCard = document.getElementById("templateTaskCard")
        let btnCreate = document.getElementById("btnCreate")
        let btnIndex = document.getElementById("btnIndex")

        btnCreate.onclick =  ApiRequestTasksCreate
        btnIndex.onclick =  ApiRequestTasksIndex



const BASE_URL = "https://www.albaash247.cloud/api";

 const STORAGE_KEY_TOKEN = "TOKEN";

 const METHOD_GET = "GET";
 const METHOD_POST = "POST";
 const METHOD_PUT = "PUT";
 const METHOD_DELETE= "DELETE";

 function get_header(method, data){

    let headerObject = {
        method:method,
        headers:{
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': 'Bearer ' + localStorage.getItem(STORAGE_KEY_TOKEN)
        }
    }
   
    if(method !== METHOD_GET){
        headerObject.body = new URLSearchParams(data);
    }

    return headerObject;
}

      

async function ApiRequestTasksCreate(){

    let isDone = inputTaskDone.checked? 1 : 0;

  let data = {
        name : inputTaskName.value,
        done: isDone,
        description: inputTaskDesc.value,
        task_category_id: inputTaskCatId.value,
    }


    let response = await fetch(`${BASE_URL}/tasks`, get_header(METHOD_POST, data));

       
    console.log("response", response);
        
        if(!response.ok){
            alert("what have you done!!!!!! "+response.status )
            return;
        }
       
        let jsonResponse = await response.json();
        console.log("jsonResponse", jsonResponse);

        // textResult.innerHTML = JSON.stringify(jsonResponse)

}



async function ApiRequestTasksIndex() {
    
    let response = await fetch(`${BASE_URL}/tasks/`, get_header(METHOD_GET, null));

    if(!response.ok){
        alert("What have done ! ");
        console.log("Error ", response.status, response.statusText);
        return;
    }

    let jsonResponse = await response.json();

    // textResult.innerText = JSON.stringify(jsonResponse);

    createTask(jsonResponse)
}


function createTask(jsonResponse){
            logContainer.innerHTML = "";


            jsonResponse.data.forEach(t => {
            let clone = templateTaskCard.content.cloneNode(true);
            let taskName = clone.getElementById("taskName");
            taskName.innerText = t.name
                logContainer.appendChild(clone);
                
            });
            

        }

    </script>

</body>

</html>
