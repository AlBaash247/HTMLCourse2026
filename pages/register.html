<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

    <div class="main-container column">

        <div class="nav-container">
            <div class="nav-content-container">
                <h1>Kite</h1>
            </div>

            <div id="navLinksContainer" class="nav-content-container">
            </div>

            <div id="navAuthLinksContainer" class="nav-content-container">
            </div>

        </div>

        <div id="registerCard" class="modal-content" style="margin:24px auto 0; width:min(90%, 600px); height:auto;">
            <div class="modal-header" style="background: var(--primary-color); color: white;">
                <h2>Register</h2>
            </div>
            <div class="modal-body" style="display:block; padding: 16px;">
                <div id="registerForm" class="modal-form">
                    <div class="input-group">
                        <label class="modal-form-label" for="inputName">Name</label>
                        <input id="inputName" type="text" class="input modal-form-input" placeholder="yousuf" value="yousuf" />
                    </div>

                    <div class="input-group">
                        <label class="modal-form-label" for="inputEmail">Email</label>
                        <input id="inputEmail" type="email" class="input modal-form-input" placeholder="email" value="testuser5@mail.com" />
                    </div>

                    <div class="input-group">
                        <label class="modal-form-label" for="inputPassword">Password</label>
                        <input id="inputPassword" type="password" class="input modal-form-input" placeholder="password" value="Pass@123" />
                    </div>

                    <button id="btnRegister" class="btn btn-primary w-100">REGISTER</button>
                    
                    <div class="row justify-between align-baseline gap-8">
                        <p>You already have an account?</p>
                        <a href="./login.html">Login</a>
                    </div>

                </div>
            </div>
        </div>

    </div>


    <script type="module" src="../js/scripts/register.js"></script>
    <script type="module" src="../js/templates/nav-bar.js"></script>

</body>

</html>
