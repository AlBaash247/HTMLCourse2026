<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/main.css">

</head>

<body>

    <div class="auth-form-container">


        <div id="test"></div>


        <div class="auth-form">
            <div class="column justify-center">
                <h2 class="text-center">Register</h2>
                <p class="text-center"> Create a new account</p>
            </div>
            <input id="inputName" type="name" placeholder="yousuf" value="yousuf" />
            <input id="inputEmail" type="email" placeholder="email" value="testuser1@mail.com" />
            <input id="inputPassword" type="password" placeholder="password" value="Pass@123" />

            <br>

            <button id="btnRegister" class="btn w-100 btn-primary">REGISTER</button>
            <div class="row justify-between align-baseline gap-8">
                <p>You already have an account?</p>
                <a href="./login.html">Login</a>
            </div>

        </div>

    </div>


    <script type="module" src="../js/scripts/register.js"></script>
</body>

</html>
