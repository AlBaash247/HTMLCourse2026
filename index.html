<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link rel="stylesheet" href="./css/main.css">

</head>

<body>
    <div class="main-container column">

        <div class="nav-container">
            <div class="nav-content-container">
                <h1>Kite</h1>
            </div>

            <div id="navLinksContainer" class="nav-content-container">
            </div>

            <div id="navAuthLinksContainer" class="nav-content-container">
            </div>

        </div>



        <div id="mainTasksColumnsContainer" class="task-card-main-container">
            
            <!-- taskColumnContainerTemplate ->>> here -->
        </div>


    </div>





    <!-- Show Modal -->
    <div id="showTaskModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <div id="showTaskModalHeader" class="modal-header">
                <span id="showTaskModalClose" class="close">&times;</span>
                <h2 id="showTaskModalTitle" >Modal Header</h2>
            </div>
            <div class="modal-body">
                <p id="showTaskModalDesc">Some text in the Modal Body show</p>
            </div>
            <!-- <div class="modal-footer">
                <h3>Modal Footer</h3>
            </div> -->
        </div>

    </div>

        

    <!-- Add Modal -->
    <div id="addTaskModal" class="modal">

        <!-- Modal content -->
        <div class="modal-content">
            <div id="addTaskModalHeader" class="modal-header">
                <span id="addTaskModalClose" class="close">&times;</span>
                <h2 id="addTaskModalTitle">Modal Header</h2>
            </div>
            <div class="modal-body">
                <p id="addTaskModalDesc">Fill in task details below.</p>
                <form id="addTaskForm" class="modal-form">
                    <label for="inputTaskNameShowModal">Task Name <span class="required">*</span></label>
                    <input id="inputTaskNameShowModal" type="text" placeholder="Enter task name" required>

                    <label for="inputTaskDescShowModal">Description</label>
                    <textarea id="inputTaskDescShowModal" placeholder="Optional description"></textarea>

                    <input id="inputTaskCategoryShowModal" type="hidden" value="">

                    <div class="modal-actions">
                        <button id="addTaskSubmit" type="button" class="button">Add Task</button>
                    </div>
                </form>
            </div>
            <!-- <div class="modal-footer">
                <h3>Modal Footer</h3>
            </div> -->
        </div>

    </div>



    <template id="taskColumnContainerTemplate">

        <div id="taskColumn" class="column task-card-container">
            <div class="task-card-header">
                <h2 id="taskColumnTitle">Log</h2>
                <span id="taskColumnAddTask" class="close">+</span>
                
            </div>

            <div id="taskColumnCardsContainer" class="task-card-content-container">
                <!-- taskCardTemplate ->>> here -->
            </div>

        </div>
    </template>

    <template id="taskCardTemplate">
        <div id="taskCard" class="task-card">
            <h4 id="taskCardTitle" class="task-card-title">Task 1</h4>
            <p id="taskCardDesc" class="task-card-content">Lorem ipsum dolor sit amet consectetur, adipisicing elit.
                Asperiores vel, at dignissimos odit enim distinctio quasi.</p>
        </div>
    </template>



    <script type="module" src="./js/templates/nav-bar.js"></script>
    <script type="module" src="./js/templates/demo-tasks.js"></script>
    <script type="module" src="./js/scripts/index.js"></script>
</body>

</html>
