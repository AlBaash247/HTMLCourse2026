<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <button id="btnPrintMyName">Print my name</button>

    <h1 id="resultText"></h1>


    <script>

        let btnPrintMyName = document.getElementById("btnPrintMyName")
        let resultText = document.getElementById("resultText")
        let س = 110



        btnPrintMyName.onclick = goodboy


        // creating a function named goodboy
        function goodboy() {
            const today = new Date();
         
            printIntoResultText(today.toLocaleDateString())
            printIntoResultText("\n Mohammmed ,")
            printIntoResultText("yousuf , \n")
            printIntoResultText("حافظ , \n")
            printIntoResultText("ابوبكر , \n")
            printIntoResultText("عبدالرحمن , \n")
            printIntoResultText( س)
        }

        function printIntoResultText(data){
          resultText.innerText += data 
        }


    </script>


</body>

</html>
