<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .my-container {
            display: flex;
            flex-flow: row wrap;
        }

        .card {
            width: 400px;
            height: 300px;
            border-radius: 8px;
            display: flex;
            flex-flow: column;
            align-items: center;
            padding: 16px;
            margin: 32px;
            box-shadow: 0 4px 8px 0 silver;
        }
    </style>
</head>



<body>





    <button id="btnCreate"> Create Card </button>

    <div id="myContainer" class="my-container">
        <!-- card template lives here -->
    </div>

    <template id="cardTemplate">
        <div id="card" class="card">
            <h3 id="cardTitle" class="card-title">Title </h3>
            <p id="cardBody" class="card-body">Body</p>
        </div>
    </template>

    <script>
        let btnCreate = document.getElementById("btnCreate");
        let myContainer = document.getElementById("myContainer");
        let cardTemplate = document.getElementById("cardTemplate");


        btnCreate.onclick = createCard

        let index = 0;
        function createCard(){
            // clone/copy template content
            let clone = cardTemplate.content.cloneNode(true);
            let card = clone.getElementById("card");
            let cardTitle = clone.getElementById("cardTitle");
            let cardBody = clone.getElementById("cardBody");

            let title = "Title "+ (index+1);
            cardTitle.innerText = title

            card.onclick = function() {
                alert(title)
            }



            myContainer.appendChild(clone);

            index++;
        }



    </script>


</body>

</html>
