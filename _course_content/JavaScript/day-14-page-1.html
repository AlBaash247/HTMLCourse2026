<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .card{
            box-shadow: 0 4px 8px 0 silver;
            width: 300px;
            padding: 16px;
        }

        .card-img{
            width: 100%;
        }

        .row{
            display: flex;
        }

        .wrap{
            flex-wrap: wrap;
        }

        .gap-8{
            gap: 8px
        }

        .gap-16{
            gap: 16px
        }

        .mb-16{
            margin-bottom: 16px;
        }

        input{
            width: 400px;
            font-size: larger;
        }
    </style>
  
</head>



<body>

    <div class="my-container gap-8 mb-16">

        <input id="inputImgsLimiter" type="number" placeholder="limit number of images in the page" value="20"/>
        <input id="inputImgsPage" type="number" placeholder="limit number of the page" value="1"/>

        <button id="btnSubmit">Submit</button>

    </div>

    <div id="myContainer" class="row wrap gap-16">
    <!-- templateCard lives here -->
    </div>

    
    
    <template id="templateCard">

    <div class="card">
        
        <img id="cardImg"  class="card-img" src="">
        <div class="row gap-8">
            <h3> id: </h3> 
            <h3 id="cardId"></h3>
        </div>
        <div class="row gap-8">
            <h3> Author: </h3> 
            <h3 id="cardAuthor"></h3>
        </div>
    </div>
    </template>


    <script>


        let myContainer = document.getElementById("myContainer");
        let templateCard = document.getElementById("templateCard");
      
        let inputImgsLimiter = document.getElementById("inputImgsLimiter");
        let inputImgsPage = document.getElementById("inputImgsPage");
        let btnSubmit = document.getElementById("btnSubmit");

        btnSubmit.onclick =  ApiRequestGetImgs

        class PicsumPhotos{
            constructor(id, author, width, height, url, download_url){
                this.id = id;
                this.author = author;
                this.width = width;
                this.height = height;
                this.url = url
                this.download_url = download_url
            }
        }

        let  photosList = [];

   
    ApiRequestGetImgs();

    async function ApiRequestGetImgs(){

        myContainer.innerHTML = "";

        let page = parseInt(inputImgsPage.value);
        let limit = parseInt(inputImgsLimiter.value);

        let response = await fetch(`https://picsum.photos/v2/list?page=${page}&limit=${limit}`);

        console.log("response", response);
        
        if(!response.ok){
            alert("what have you done!!!!!! "+response.status )
            return;
        }

        let jsonResponse = await response.json();

        console.log("jsonResponse", jsonResponse);

        jsonResponse.forEach(p => {
            createImageCard(p);   
        });

    }

  

  function createImageCard(pictureObject){
    let clone = templateCard.content.cloneNode(true);
    let cardImg = clone.getElementById("cardImg");
    let cardId = clone.getElementById("cardId");
    let cardAuthor = clone.getElementById("cardAuthor");

    cardId.innerText = pictureObject.id;
    cardImg.src = pictureObject.download_url;
    cardAuthor.innerText = pictureObject.author;

    let picsumPhotosObject = new PicsumPhotos();
     picsumPhotosObject.id = pictureObject.id;
     picsumPhotosObject.author = pictureObject.author;
     picsumPhotosObject.width = pictureObject.width;
     picsumPhotosObject.height = pictureObject.height;
     picsumPhotosObject.url = pictureObject.url
     picsumPhotosObject.download_url = pictureObject.download_url

    photosList.push(picsumPhotosObject);

    myContainer.appendChild(clone);


    console.log(photosList);
    
  }

        //     myContainer.innerHTML = ""
           
        //         let studentName = clone.getElementById("studentName")
        //         studentName.innerText = student.name;

        //        
            
        // }

    </script>


</body>

</html>
