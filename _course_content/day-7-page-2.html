<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;

        }

        .nav-container {
            display: flex;
            flex-flow: row wrap;
            justify-content: space-between;
            gap: 12px;
            padding: 24px;
            background-color: #f9f9f9;
            box-shadow: 0 4px 8px #c3c3c3;
        }

        .nav-link {
            padding: 8px 32px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 4px 8px #c3c3c3;
        }

        .nav-link:hover {
            scale: 1.1;
            border-radius: 8px 10px 10px 10px;

            border-right: 1px solid #cfe5fd;
            border-bottom: 1px solid #cfe5fd;
            box-shadow: 0 8px 12px #e2f0ff, 0 4px 8px #f1f0f0;

        }
    </style>

</head>

<body>

    <div class="nav-container">
        <a href="" class="nav-link">link 1</a>
        <a href="" class="nav-link">link 2</a>
        <a href="" class="nav-link">link 3</a>
        <a href="" class="nav-link">link 4</a>
        <a href="" class="nav-link">link 4</a>

    </div>


</body>

</html>
